<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>かいせい食堂｜注文システム</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div id="parentContainer">


<!-- =====================================
     テーブル選択画面
===================================== -->

<section
  class="table-screen"
  id="tableScreen"
>

  <div class="table-top">

    <div class="table-shop-name">
      かいせい食堂
    </div>

    <div class="table-title">
      テーブルの番号を<br>
      押してください
    </div>

    <div class="table-subtitle">
      ご利用のテーブルを選択してください
    </div>

  </div>


  <div
    class="table-grid"
    id="tableGrid"
  ></div>


  <div class="table-confirm-area">

    <div
      class="table-selected-info"
      id="tableSelectedInfo"
    >
      テーブルを選択してください
    </div>


    <button
      class="table-confirm"
      id="tableConfirm"
      disabled
    >
      このテーブルで注文する
    </button>

  </div>

</section>



<!-- =====================================
     ヘッダー
===================================== -->

<header class="header">

  <div>

    <div class="shop-title">
      かいせい食堂
    </div>

    <div class="shop-subtitle">
      ご注文はこちらから
    </div>

  </div>


  <div class="status">

    <span class="status-dot"></span>

    営業中

  </div>

</header>



<!-- =====================================
     メイン
===================================== -->

<main class="main">

  <div
    class="current-table"
    id="currentTable"
  >
    テーブル -
  </div>


  <div class="welcome">
    お好きな料理をどうぞ
  </div>


  <nav
    class="categories"
    id="categories"
  >

    <button
      class="category-button active"
      data-category="all"
    >
      すべて
    </button>


    <button
      class="category-button"
      data-category="teishoku"
    >
      定食
    </button>


    <button
      class="category-button"
      data-category="don"
    >
      丼・ご飯
    </button>


    <button
      class="category-button"
      data-category="men"
    >
      麺類
    </button>


    <button
      class="category-button"
      data-category="ichin"
    >
      一品料理
    </button>


    <button
      class="category-button"
      data-category="drink"
    >
      お飲み物
    </button>


    <button
      class="category-button"
      data-category="takeout"
    >
      テイクアウト
    </button>

  </nav>


  <div
    class="products"
    id="products"
  ></div>

</main>



<!-- =====================================
     下部注文バー
===================================== -->

<div class="order-bar">

  <div class="order-summary">

    <div
      class="order-count"
      id="orderCount"
    >
      0点
    </div>


    <div
      class="order-total"
      id="orderTotal"
    >
      ¥0
    </div>

  </div>


  <button
    class="order-open"
    id="orderOpen"
  >
    注文内容を見る
  </button>

</div>



<!-- =====================================
     カート
===================================== -->

<section
  class="cart-screen"
  id="cartScreen"
>

  <div class="cart-header">

    <button
      class="cart-back"
      id="cartBack"
    >
      ‹
    </button>


    <div class="cart-title">
      注文内容
    </div>


    <div
      class="cart-table"
      id="cartTable"
    >
      テーブル -
    </div>

  </div>


  <div
    class="cart-content"
    id="cartContent"
  ></div>


  <div class="cart-footer">

    <div class="cart-total-row">

      <div class="cart-total-label">
        合計
      </div>


      <div
        class="cart-total"
        id="cartTotal"
      >
        ¥0
      </div>

    </div>


    <button
      class="confirm-order"
      id="confirmOrder"
      disabled
    >
      注文を確定する
    </button>

  </div>

</section>



<!-- =====================================
     注文完了モーダル
===================================== -->

<div
  class="modal"
  id="modal"
>

  <div class="modal-box">

    <div class="modal-icon">
      ✓
    </div>


    <div class="modal-title">
      ご注文を受け付けました
    </div>


    <div
      class="modal-message"
      id="modalMessage"
    >
      テーブルのご注文を受け付けました。
    </div>


    <button
      class="modal-close"
      id="modalClose"
    >
      閉じる
    </button>

  </div>

</div>


</div>



<!-- =====================================
     JavaScript
     
     ※読み込みは元のまま残しています
===================================== -->

<script type="module" src="firebase.js"></script>

<script type="module" src="app.js"></script>

<script type="module" src="menu-firebase.js"></script>

<script type="module" src="product.js"></script>

<script type="module" src="products.js"></script>


</body>
</html>
